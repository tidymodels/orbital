# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Cache Spark
        id: cache-spark
        uses: actions/cache@v4
        with:
          path: /home/runner/spark/spark-3.3.4-bin-hadoop3
          key: sparklyr-spark-3.3.4-bin-hadoop3-3
          restore-keys: |
            sparklyr-spark-3.3.4-bin-hadoop3-

      # See the note in Spark-Tests.yaml: archive.apache.org deliberately
      # throttles this download to something like 100-200KB/s, so download it
      # with a resumable `curl -C -` first (no artificial per-attempt
      # timeout, and retries resume instead of restarting from zero); once
      # the extracted directory exists, `spark_install()` below sees it and
      # skips downloading entirely.
      - name: Download Spark
        if: steps.cache-spark.outputs.cache-hit != 'true'
        run: |
          info <- sparklyr:::spark_install_find(
            version = "3.3.4",
            hadoop_version = "3",
            installed_only = FALSE,
            latest = TRUE
          )
          if (!dir.exists(info$sparkVersionDir)) {
            dir.create(info$sparkDir, recursive = TRUE, showWarnings = FALSE)
            status <- system2(
              "curl",
              c(
                "--fail", "--location", "--continue-at", "-",
                "--retry", "20", "--retry-all-errors", "--retry-delay", "10",
                "--output", info$packageLocalPath, info$packageRemotePath
              )
            )
            if (status != 0) {
              stop("Could not download Spark (curl exit status ", status, ").")
            }
            untar(info$packageLocalPath, exdir = info$sparkDir, tar = "internal")
            unlink(info$packageLocalPath)
          }
        shell: Rscript {0}

      - name: Install Spark (via sparklyr)
        if: steps.cache-spark.outputs.cache-hit != 'true'
        run: |
          sparklyr::spark_install(version = "3.3.4", hadoop_version = "3")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs