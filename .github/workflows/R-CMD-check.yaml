# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}

          - {os: windows-latest, r: 'release'}
          # use 4.0 or 4.1 to check with rtools40's older compiler
          #
          # The lme4 binary for this R version was built against a newer Matrix
          # than the one resolved here, so it aborts on load with "lme4 was
          # built with Matrix ABI version 1 / Current Matrix ABI version is 0",
          # taking the step_lencode_* tests with it. Building lme4 from source
          # links it against the Matrix actually installed, which is what lme4's
          # own error message recommends.
          - {os: windows-latest, r: 'oldrel-4', extra: ', lme4?source'}

          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'oldrel-2'}
          - {os: ubuntu-latest,  r: 'oldrel-3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # mixOmics comes from Bioconductor, and the Bioconductor mirrors for
          # the releases matching R 4.3 and older are no longer reachable, which
          # fails dependency resolution outright rather than just skipping it.
          # plsmod imports mixOmics, so it has to go too; its tests already skip
          # when the engine is missing.
          #
          # xrf imports xgboost, so installing it on an R version where xgboost
          # is skipped would drag xgboost back in and un-skip the tests that the
          # threshold above exists to skip. It carries the same threshold.
          extra-packages: any::rcmdcheck, xgboost=?ignore-before-r=4.3.0, xrf=?ignore-before-r=4.3.0, mixOmics=?ignore-before-r=4.4.0, plsmod=?ignore-before-r=4.4.0${{ matrix.config.extra }}
          needs: check

      - name: Install catboost
        run: |
          install.packages('remotes')
          os <- Sys.getenv("GHA_OS")
          if (os == "macos-latest") {
            name <- "Darwin"
          } else if (os == "windows-latest") {
            name <- "Windows"
          } else {
            name <- "Linux"
          }
          url <- paste0(
            'https://github.com/catboost/catboost/releases/download/v1.2.8/catboost-R-', 
            name,
            '-1.2.8.tgz'
          )
          remotes::install_url(url, INSTALL_opts = c("--no-multiarch", "--no-test-load", "--no-staged-install"))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
