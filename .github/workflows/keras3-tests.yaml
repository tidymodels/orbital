# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: keras3-tests.yaml

jobs:
  keras3-tests:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::keras3

      - name: Cache keras3's Python virtualenv
        id: cache-keras
        uses: actions/cache@v4
        with:
          path: ~/.virtualenvs/r-keras
          key: keras3-r-keras-venv-2

      # PyPI/TensorFlow downloads are occasionally flaky on GitHub Actions
      # runners, so a single install attempt can fail transiently. Retry with
      # backoff: it only has to succeed once for the cache above to be
      # seeded, after which this step is skipped entirely.
      - name: Install keras3 (TensorFlow backend)
        if: steps.cache-keras.outputs.cache-hit != 'true'
        run: |
          attempts <- 5
          for (i in seq_len(attempts)) {
            ok <- tryCatch(
              {
                keras3::install_keras(backend = "tensorflow")
                TRUE
              },
              error = function(cnd) {
                message("Attempt ", i, " of ", attempts, " failed: ", conditionMessage(cnd))
                FALSE
              }
            )
            if (ok) break
            if (i < attempts) Sys.sleep(i * 20)
          }
          if (!ok) {
            stop("Could not install keras3 after ", attempts, " attempts.")
          }
        shell: Rscript {0}

      - name: R Session Info
        run: sessionInfo()
        shell: Rscript {0}

      - name: R Installed Packages
        run: |
          m_pkgs <- installed.packages()
          t_pkgs <- as.data.frame(m_pkgs, row.names = FALSE)
          print(t_pkgs[, c("Package", "Version")])
        shell: Rscript {0}

      - name: R Tests
        run: |
          devtools::load_all()
          devtools::test()
        shell: Rscript {0}
